<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Three converter topologies represented by AdvancedInverter</title>
  <desc id="desc">Comparison of a three-leg three-wire bridge, a three-leg split-DC four-wire bridge, and a four-leg four-wire bridge, emphasizing their neutral-current paths.</desc>
  <defs>
    <style>
      .panel{fill:#f8fafc;stroke:#64748b;stroke-width:2}.rail{stroke:#0f172a;stroke-width:4}.wire{stroke:#334155;stroke-width:3;fill:none}.leg{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.cap{stroke:#7c3aed;stroke-width:4}.node{fill:#0f172a}.title{font:600 21px system-ui,sans-serif;fill:#0f172a}.label{font:16px system-ui,sans-serif;fill:#1e293b}.small{font:14px system-ui,sans-serif;fill:#475569}.good{font:600 15px system-ui,sans-serif;fill:#166534}.warn{font:600 15px system-ui,sans-serif;fill:#9a3412}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <rect class="panel" x="15" y="15" width="370" height="435" rx="12"/>
  <rect class="panel" x="415" y="15" width="370" height="435" rx="12"/>
  <rect class="panel" x="815" y="15" width="370" height="435" rx="12"/>

  <text class="title" x="200" y="50" text-anchor="middle">3-leg, 3-wire</text>
  <text class="small" x="200" y="75" text-anchor="middle">topology = :THREE_LEG</text>
  <line class="rail" x1="75" y1="110" x2="270" y2="110"/><line class="rail" x1="75" y1="330" x2="270" y2="330"/>
  <line class="cap" x1="90" y1="165" x2="90" y2="205"/><line class="cap" x1="72" y1="215" x2="108" y2="215"/><line class="cap" x1="72" y1="228" x2="108" y2="228"/><line class="cap" x1="90" y1="238" x2="90" y2="278"/>
  <text class="label" x="54" y="226">C</text>
  <g><rect class="leg" x="145" y="145" width="38" height="150" rx="5"/><rect class="leg" x="205" y="145" width="38" height="150" rx="5"/><rect class="leg" x="265" y="145" width="38" height="150" rx="5"/></g>
  <line class="wire" x1="164" y1="220" x2="345" y2="220"/><line class="wire" x1="224" y1="250" x2="345" y2="250"/><line class="wire" x1="284" y1="280" x2="345" y2="280"/>
  <text class="label" x="352" y="225">a</text><text class="label" x="352" y="255">b</text><text class="label" x="352" y="285">c</text>
  <text class="warn" x="200" y="370" text-anchor="middle">No neutral path</text><text class="small" x="200" y="397" text-anchor="middle">I₀ = 0 and ΣIₓ = 0</text><text class="small" x="200" y="421" text-anchor="middle">best DC utilisation</text>

  <text class="title" x="600" y="50" text-anchor="middle">3-leg, split DC</text>
  <text class="small" x="600" y="75" text-anchor="middle">topology = :SPLIT_DC</text>
  <line class="rail" x1="475" y1="110" x2="670" y2="110"/><line class="rail" x1="475" y1="330" x2="670" y2="330"/>
  <line class="cap" x1="490" y1="130" x2="490" y2="165"/><line class="cap" x1="472" y1="175" x2="508" y2="175"/><line class="cap" x1="472" y1="188" x2="508" y2="188"/><line class="cap" x1="490" y1="198" x2="490" y2="220"/>
  <circle class="node" cx="490" cy="220" r="5"/><line class="cap" x1="490" y1="220" x2="490" y2="242"/><line class="cap" x1="472" y1="252" x2="508" y2="252"/><line class="cap" x1="472" y1="265" x2="508" y2="265"/><line class="cap" x1="490" y1="275" x2="490" y2="310"/>
  <text class="label" x="452" y="182">C</text><text class="label" x="452" y="260">C</text>
  <g><rect class="leg" x="545" y="145" width="38" height="150" rx="5"/><rect class="leg" x="605" y="145" width="38" height="150" rx="5"/><rect class="leg" x="665" y="145" width="38" height="150" rx="5"/></g>
  <line class="wire" x1="564" y1="170" x2="745" y2="170"/><line class="wire" x1="624" y1="200" x2="745" y2="200"/><line class="wire" x1="684" y1="230" x2="745" y2="230"/><line class="wire" x1="490" y1="220" x2="520" y2="220"/><path class="wire" d="M520 220V280H745" marker-end="url(#arrow)"/>
  <text class="label" x="752" y="175">a</text><text class="label" x="752" y="205">b</text><text class="label" x="752" y="235">c</text><text class="label" x="752" y="285">n</text>
  <text class="warn" x="600" y="370" text-anchor="middle">Neutral flows through half-banks</text><text class="small" x="600" y="397" text-anchor="middle">Iₙ, midpoint ripple, and heating couple</text><text class="small" x="600" y="421" text-anchor="middle">half-bus modulation penalty</text>

  <text class="title" x="1000" y="50" text-anchor="middle">4-leg, 4-wire</text>
  <text class="small" x="1000" y="75" text-anchor="middle">topology = :FOUR_LEG</text>
  <line class="rail" x1="875" y1="110" x2="1110" y2="110"/><line class="rail" x1="875" y1="330" x2="1110" y2="330"/>
  <line class="cap" x1="890" y1="165" x2="890" y2="205"/><line class="cap" x1="872" y1="215" x2="908" y2="215"/><line class="cap" x1="872" y1="228" x2="908" y2="228"/><line class="cap" x1="890" y1="238" x2="890" y2="278"/><text class="label" x="854" y="226">C</text>
  <g><rect class="leg" x="945" y="145" width="32" height="150" rx="5"/><rect class="leg" x="990" y="145" width="32" height="150" rx="5"/><rect class="leg" x="1035" y="145" width="32" height="150" rx="5"/><rect class="leg" x="1080" y="145" width="32" height="150" rx="5"/></g>
  <line class="wire" x1="961" y1="170" x2="1145" y2="170"/><line class="wire" x1="1006" y1="200" x2="1145" y2="200"/><line class="wire" x1="1051" y1="230" x2="1145" y2="230"/><line class="wire" x1="1096" y1="280" x2="1145" y2="280" marker-end="url(#arrow)"/>
  <text class="label" x="1152" y="175">a</text><text class="label" x="1152" y="205">b</text><text class="label" x="1152" y="235">c</text><text class="label" x="1152" y="285">n</text>
  <text class="good" x="1000" y="370" text-anchor="middle">Dedicated neutral leg</text><text class="small" x="1000" y="397" text-anchor="middle">Iₙ loads semiconductors, not split caps</text><text class="small" x="1000" y="421" text-anchor="middle">fourth-leg rating and loss are explicit</text>
</svg>
