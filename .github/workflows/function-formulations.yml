name: Optional function formulations
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  external-backends:
    name: PWL and CCOpt - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Instantiate production source pin
        run: julia --project=. scripts/instantiate_pinned.jl
      - name: Create isolated optional-backend environment
        run: julia scripts/formulations/setup.jl "${{ runner.temp }}/pwl-env"
      - name: Test exact graphs and characterize CCOpt
        env:
          POL_FORMULATION_RESULTS: ${{ runner.temp }}/pwl-results.toml
        run: julia --project="${{ runner.temp }}/pwl-env" scripts/formulations/optional_tests.jl
      - name: Exercise the control-lowering tutorial with external solvers
        env:
          POL_FORMULATION_RESULTS: ${{ runner.temp }}/pwl-results-control-lowering.toml
        run: julia --project="${{ runner.temp }}/pwl-env" scripts/formulations/control_lowering_optional.jl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formulation-results-julia-${{ matrix.version }}
          path: ${{ runner.temp }}/pwl-results*.toml
          if-no-files-found: warn
