name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 3'   # weekly, Wednesday 00:00 UTC
# allow julia-actions/cache to delete old caches it created
permissions:
  actions: write
  contents: read
jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']   # declared compat floor and latest stable
        os: [ubuntu-latest]
        arch: [default]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # Install the reviewed main commit from Project.toml, replacing any
      # cached revision. The setup script verifies the resolved source SHA.
      - name: Instantiate dependencies at the reviewed BMOPFTools main commit
        run: julia --project=. scripts/instantiate_pinned.jl
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - name: Execute DOE tutorial code and scientific assertions
        if: ${{ !cancelled() }}
        run: julia --project=. scripts/run_doe_tutorials.jl
      - name: Execute study tutorials and export solved figure data
        id: study_tutorials
        if: ${{ !cancelled() }}
        run: julia --project=. scripts/run_study_tutorials.jl --figure-data docs/build/study-figure-data
      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && matrix.version == '1' && steps.study_tutorials.outcome == 'success' }}
        with:
          python-version: '3.12'
      - name: Install scientific plotting dependency
        if: ${{ !cancelled() && matrix.version == '1' && steps.study_tutorials.outcome == 'success' }}
        run: python -m pip install -r scripts/requirements-study-figures.txt
      - name: Check reproducible study figures
        if: ${{ !cancelled() && matrix.version == '1' && steps.study_tutorials.outcome == 'success' }}
        run: python scripts/render_study_figures.py --check
