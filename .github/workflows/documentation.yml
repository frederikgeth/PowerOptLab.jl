name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

jobs:
  build:
    name: Documentation - Julia ${{ matrix.version }}
    permissions:
      contents: write
      statuses: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      # docs/Project.toml declares the local PowerOptLab source and pins the
      # unregistered BMOPFTools source to the tested commit.
      - name: Install dependencies at the tested BMOPFTools commit
        run: julia --project=docs scripts/instantiate_pinned.jl
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCUMENTER_DEPLOY: ${{ matrix.version == '1' && 'true' || 'false' }}
        run: julia --color=yes --project=docs/ docs/make.jl
