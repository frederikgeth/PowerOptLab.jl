<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
  <title id="title">Inverter model fidelity ladder</title><desc id="desc">A ladder from point-of-connection injection models through PowerOptLab's circuit-aware fundamental-frequency model to harmonic impedance, averaged dynamic, and electromagnetic transient models.</desc>
  <defs><style>.b{stroke:#475569;stroke-width:2}.poc{fill:#e2e8f0}.here{fill:#dbeafe;stroke:#2563eb;stroke-width:4}.next{fill:#fef3c7}.emt{fill:#fee2e2}.h{font:600 20px system-ui,sans-serif;fill:#0f172a}.t{font:600 16px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#334155}.arrow{stroke:#334155;stroke-width:3;fill:none}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker></defs>
  <text class="h" x="550" y="30" text-anchor="middle">Choose the least detailed model that can answer the study question</text>
  <rect class="poc b" x="25" y="80" width="190" height="140" rx="12"/><text class="t" x="120" y="112" text-anchor="middle">POC injection</text><text class="s" x="120" y="142" text-anchor="middle">P/Q or I limits</text><text class="s" x="120" y="166" text-anchor="middle">grid-support curves</text><text class="s" x="120" y="190" text-anchor="middle">hosting capacity</text>
  <rect class="here" x="245" y="65" width="250" height="170" rx="12"/><text class="t" x="370" y="100" text-anchor="middle">Circuit-aware fundamental</text><text class="s" x="370" y="130" text-anchor="middle">phase + neutral filter KVL</text><text class="s" x="370" y="154" text-anchor="middle">topology switching hull</text><text class="s" x="370" y="178" text-anchor="middle">I₀/I₁/I₂ and 2ω ripple</text><text class="s" x="370" y="202" text-anchor="middle">PowerOptLab AdvancedInverter</text>
  <rect class="next b" x="525" y="80" width="170" height="140" rx="12"/><text class="t" x="610" y="112" text-anchor="middle">Harmonic /</text><text class="t" x="610" y="135" text-anchor="middle">impedance</text><text class="s" x="610" y="166" text-anchor="middle">frequency coupling</text><text class="s" x="610" y="190" text-anchor="middle">LCL resonance, EMC</text>
  <rect class="next b" x="725" y="80" width="170" height="140" rx="12"/><text class="t" x="810" y="112" text-anchor="middle">Averaged dynamic</text><text class="s" x="810" y="142" text-anchor="middle">PLL / GFM loops</text><text class="s" x="810" y="166" text-anchor="middle">limiters and FRT</text><text class="s" x="810" y="190" text-anchor="middle">state-space tests</text>
  <rect class="emt b" x="925" y="80" width="150" height="140" rx="12"/><text class="t" x="1000" y="112" text-anchor="middle">EMT / switched</text><text class="s" x="1000" y="142" text-anchor="middle">PWM and dead time</text><text class="s" x="1000" y="166" text-anchor="middle">parasitics and faults</text><text class="s" x="1000" y="190" text-anchor="middle">device stress</text>
  <path class="arrow" d="M215 150H240" marker-end="url(#a)"/><path class="arrow" d="M495 150H520" marker-end="url(#a)"/><path class="arrow" d="M695 150H720" marker-end="url(#a)"/><path class="arrow" d="M895 150H920" marker-end="url(#a)"/>
  <text class="s" x="120" y="270" text-anchor="middle">planning abstraction</text><text class="s" x="370" y="270" text-anchor="middle">implemented scope</text><text class="s" x="800" y="270" text-anchor="middle">control-aware frequency domain</text><text class="s" x="1000" y="270" text-anchor="middle">time-domain oracle</text>
  <path class="arrow" d="M80 295H1020" marker-end="url(#a)"/><text class="s" x="550" y="315" text-anchor="middle">more states, parameters, computation, and validation burden</text>
</svg>
